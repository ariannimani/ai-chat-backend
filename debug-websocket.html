<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug WebSocket Connection</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  </head>
  <body>
    <h1>Debug WebSocket Connection</h1>
    <p>
      <strong>Note:</strong> Use UUID format for room IDs:
      <code>12345678-1234-1234-1234-123456789abc</code>
    </p>

    <div>
      <button onclick="connectWithoutAuth()">Connect WITHOUT Auth</button>
      <button onclick="connectWithAuth()">Connect WITH Auth</button>
      <button onclick="disconnect()">Disconnect</button>
    </div>

    <div>
      <h2>Connection Status:</h2>
      <div id="status">Not connected</div>
    </div>

    <div>
      <h2>Messages:</h2>
      <div
        id="messages"
        style="
          background: #f0f0f0;
          padding: 10px;
          height: 300px;
          overflow-y: auto;
        "
      ></div>
    </div>

    <script>
      let socket = null;

      function log(message) {
        const messagesDiv = document.getElementById('messages');
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function updateStatus(status, color = 'black') {
        document.getElementById('status').innerHTML =
          `<span style="color: ${color}">${status}</span>`;
      }

      function connectWithoutAuth() {
        log('Attempting connection WITHOUT authentication...');

        socket = io('http://localhost:8080/chats', {
          transports: ['websocket', 'polling'],
        });

        setupEventHandlers();
      }

      function connectWithAuth() {
        log('Attempting connection WITH authentication...');

        const token =
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2ZjBlMDk1Ni02YmZlLTQ2ODQtOTRlOS0wNzU1YzMzY2RhM2EiLCJpYXQiOjE3NTMwNDE3MjcsImV4cCI6MTc1MzY0NjUyN30.YBgQN6s9SPw1O352ncD98Sn7yw_dINJ6TWa9JT6vOoo';

        socket = io('http://localhost:8080/chats', {
          auth: {
            token: token,
          },
          transports: ['websocket', 'polling'],
        });

        setupEventHandlers();
      }

      function setupEventHandlers() {
        socket.on('connect', () => {
          updateStatus('✅ Connected', 'green');
          log('✅ Socket.IO connection established');
        });

        socket.on('disconnect', (reason) => {
          updateStatus('❌ Disconnected', 'red');
          log(`❌ Disconnected: ${reason}`);
        });

        socket.on('connect_error', (error) => {
          updateStatus('❌ Connection Error', 'red');
          log(`❌ Connection error: ${error.message}`);
          log(`Error details: ${JSON.stringify(error)}`);
        });

        socket.on('connection-success', (data) => {
          log(`🎉 Server says: ${data.message}`);
          log(`Client ID: ${data.clientId}`);
        });

        socket.on('connection-error', (data) => {
          log(`💥 Server error: ${data.message}`);
          if (data.error) {
            log(`Error details: ${data.error}`);
          }
        });

        socket.on('error', (error) => {
          log(`🚨 Socket error: ${JSON.stringify(error)}`);
        });

        // Log any other events
        socket.onAny((event, ...args) => {
          if (
            ![
              'connect',
              'disconnect',
              'connect_error',
              'connection-success',
              'connection-error',
              'error',
            ].includes(event)
          ) {
            log(`📨 Event '${event}': ${JSON.stringify(args)}`);
          }
        });
      }

      function disconnect() {
        if (socket) {
          socket.disconnect();
          socket = null;
          updateStatus('Disconnected', 'gray');
          log('Disconnected manually');
        }
      }
    </script>
  </body>
</html>
